<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAPP Language Translator</title>
   <script src="https://unpkg.com/aws-amplify@5.0.4/dist/aws-amplify.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px;
      color: #FFFFFF;
      background-image: url('https://iapptranslateresources.s3.us-east-1.amazonaws.com/iapp-lockscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    header {
      background-color: rgba(0, 47, 95, 0.9);
      padding: 20px;
      color: #FFD700;
      font-size: 24px;
      font-weight: bold;
    }
    .logo {
      max-width: 200px;
      margin-top: 20px;
    }
    select, button, textarea {
      margin: 10px;
      padding: 10px;
    }
    button {
      background-color: #FFD700;
      color: #000000;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #FFC107;
    }
  </style>
</head>
<body>

<header>
  IAPP Language Translator
</header>

https://iapptranslateresources.s3.us-east-1.amazonaws.com/iapp-logo.png

<h2>Translate Text Instantly</h2>

<label for="source-lang">Select Source Language:</label>
<select id="source-lang">
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
</select>

<label for="target-lang">Select Output Language:</label>
<select id="target-lang">
  <option value="es">Spanish</option>
  <option value="en">English</option>
  <option value="fr">French</option>
  <option value="de">German</option>
</select>

<br>

<textarea id="input-text" rows="4" cols="50" placeholder="Enter text to translate..."></textarea>

<br>

<button id="translate-btn">Translate</button>

<h2>Translated Text:</h2>
<p id="translated-text"></p>

<pre id="output">Checking login status...</pre>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const { Auth } = window.Amplify;

    Auth.configure({
      region: 'us-east-1',
      userPoolId: 'us-east-1_qrUtDYdsG', // Replace with your actual user pool ID
      userPoolWebClientId: '5acbpt930tnomatg1rptur9uoa',
      oauth: {
        domain: 'us-east-1qrutdydsg.auth.us-east-1.amazoncognito.com',
        scope: ['email', 'openid', 'phone'],
        redirectSignIn: 'https://dev.d2uluvkyv859go.amplifyapp.com/',
        redirectSignOut: 'https://dev.d2uluvkyv859go.amplifyapp.com/',
        responseType: 'code'
      }
    });

    Auth.currentAuthenticatedUser()
      .then(user => {
        document.getElementById("output").textContent = JSON.stringify(user, null, 2);
      })
      .catch(() => {
        document.getElementById("output").textContent = "Not signed in. Redirecting to login...";
        Auth.federatedSignIn();
      });

    document.getElementById("translate-btn").addEventListener("click", async function () {
      let inputText = document.getElementById("input-text").value;
      let sourceLang = document.getElementById("source-lang").value;
      let targetLang = document.getElementById("target-lang").value;

      const apiGatewayUrl = "https://d9zhzjuvfg.execute-api.us-east-1.amazonaws.com/dev";

      if (!inputText) {
        alert("Please enter text to translate.");
        return;
      }

      try {
        let response = await fetch(apiGatewayUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: inputText,
            source_lang: sourceLang,
            target_lang: targetLang
          })
        });

        let rawResponse = await response.text();
        let data;
        try {
          data = JSON.parse(rawResponse);
          if (typeof data.body === "string") {
            data.body = JSON.parse(data.body);
          }
        } catch (error) {
          console.error("JSON Parsing Error:", error);
          alert("Invalid response format from API.");
          return;
        }

        if (data.body.translated_text) {
          document.getElementById("translated-text").innerText = data.body.translated_text;
        } else {
          alert("Translation failed. Please check the API response.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Translation failed. Please check the API setup.");
      }
    });
  });
</script>

</body>
</html>
