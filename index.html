
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug Auth Flow</title>
</head>
<body>
    <h1>Debugging Cognito Auth Flow</h1>
    <pre id="log"></pre>

    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById("log").textContent += msg + "\n";
        };

        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        const storedToken = localStorage.getItem('id_token');

        if (storedToken) {
            log("Token found in localStorage.");
        } else if (authCode) {
            log("Authorization code found in URL: " + authCode);

            const tokenUrl = "https://us-east-1qrutdydsg.auth.us-east-1.amazoncognito.com/oauth2/token";
            const clientId = "5acbpt930tnomatg1rptur9uoa";
            const redirectUri = "https://dev.d2uluvkyv859go.amplifyapp.com/";

            const body = new URLSearchParams({
                grant_type: "authorization_code",
                client_id: clientId,
                code: authCode,
                redirect_uri: redirectUri
            });

            log("Sending POST request to /oauth2/token...");
            fetch(tokenUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: body
            })
            .then(response => {
                log("Received response with status: " + response.status);
                return response.json();
            })
            .then(data => {
                log("Token response: " + JSON.stringify(data, null, 2));
                if (data.id_token) {
                    localStorage.setItem('id_token', data.id_token);
                    log("Token stored in localStorage.");
                    window.history.replaceState({}, document.title, "/");
                } else {
                    alert("Token exchange failed. No id_token received.");
                }
            })
            .catch(error => {
                log("Token request failed: " + error);
                alert("Token exchange failed. See console for details.");
            });
        } else {
            log("No token or authorization code found. Redirecting to login...");
            window.location.href = "https://us-east-1qrutdydsg.auth.us-east-1.amazoncognito.com/login?client_id=5acbpt930tnomatg1rptur9uoa&response_type=code&scope=email+openid+phone&redirect_uri=https%3A%2F%2Fdev.d2uluvkyv859go.amplifyapp.com%2F";
        }
    </script>
</body>
</html>
