<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IAPP Language Translator</title>

  <!-- AWS Amplify CDN -->
  https://unpkg.com/aws-amplify@5.0.4/dist/aws-amplify.min.js

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px;
      color: #FFFFFF;
      background-image: url('https://iapptranslateresources.s3.us-east-1.amazonaws.com/iapp-lockscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    header {
      background-color: rgba(0, 47, 95, 0.9);
      padding: 20px;
      color: #FFD700;
      font-size: 24px;
      font-weight: bold;
    }
    .logo {
      max-width: 200px;
      margin-top: 20px;
    }
    select, button, textarea {
      margin: 10px;
      padding: 10px;
    }
    button {
      background-color: #FFD700;
      color: #000000;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #FFC107;
    }
  </style>
</head>
<body>

<script>
  // Configure Amplify Auth
  window.Amplify.configure({
    Auth: {
      region: 'us-east-1',
      userPoolId: 'us-east-1_UZFvptknE', // Replace with your actual User Pool ID
      userPoolWebClientId: '1f5vh84vm4lafajc5575b7tv8t', // Replace with your App Client ID
      oauth: {
        domain: 'us-east-1uzfvptkne.auth.us-east-1.amazoncognito.com',
        scope: ['email', 'openid', 'phone'],
        redirectSignIn: 'https://d84l1y8p4kdic.cloudfront.net',
        redirectSignOut: 'https://d84l1y8p4kdic.cloudfront.net',
        responseType: 'code'
      }
    }
  });

  // Check if user is signed in, otherwise redirect to Hosted UI
  window.Amplify.Auth.currentAuthenticatedUser()
    .then(user => {
      console.log("User signed in:", user);
    })
    .catch(() => {
      console.log("User not signed in, redirecting...");
      window.Amplify.Auth.federatedSignIn();
    });
</script>

<header>
  IAPP Language Translator
</header>

https://iapptranslateresources.s3.us-east-1.amazonaws.com/iapp-logo.png

<h2>Translate Text Instantly</h2>

<label for="source-lang">Select Source Language:</label>
<select id="source-lang">
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
</select>

<label for="target-lang">Select Output Language:</label>
<select id="target-lang">
  <option value="es">Spanish</option>
  <option value="en">English</option>
  <option value="fr">French</option>
  <option value="de">German</option>
</select>

<br>

<textarea id="input-text" rows="4" cols="50" placeholder="Enter text to translate..."></textarea>

<br>

<button id="translate-btn">Translate</button>

<h2>Translated Text:</h2>
<p id="translated-text"></p>

<script>
  document.getElementById("translate-btn").addEventListener("click", async function () {
    let inputText = document.getElementById("input-text").value;
    let sourceLang = document.getElementById("source-lang").value;
    let targetLang = document.getElementById("target-lang").value;

    const apiGatewayUrl = "https://d9zhzjuvfg.execute-api.us-east-1.amazonaws.com/dev";

    if (!inputText) {
      alert("Please enter text to translate.");
      return;
    }

    try {
      const session = await window.Amplify.Auth.currentSession();
      const idToken = session.getIdToken().getJwtToken();

      let response = await fetch(apiGatewayUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": idToken
        },
        body: JSON.stringify({
          text: inputText,
          source_lang: sourceLang,
          target_lang: targetLang
        })
      });

      let rawResponse = await response.text();
      let data;
      try {
        data = JSON.parse(rawResponse);
        if (typeof data.body === "string") {
          data.body = JSON.parse(data.body);
        }
      } catch (error) {
        console.error("JSON Parsing Error:", error);
        alert("Invalid response format from API.");
        return;
      }

      if (data.body.translated_text) {
        document.getElementById("translated-text").innerText = data.body.translated_text;
      } else {
        alert("Translation failed. Please check the API response.");
        console.error("Unexpected API Response Structure:", data);
      }
    } catch (error) {
      console.error("Error:", error);
      alert("Translation failed. Please check the API setup or authentication.");
    }
  });
</script>

</body>
</html>
